<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bram — Desktop</title>
  <meta name="description" content="Personal showcase & portfolio of Bram — a desktop you can poke around in." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <!-- ===== Boot screen ===== -->
  <div id="boot" class="boot">
    <div class="boot-logo"></div>
    <div class="boot-bar"><div class="boot-bar-fill"></div></div>
  </div>

  <!-- ===== Menu bar ===== -->
  <header id="menubar" class="menubar">
    <div class="menubar-left">
      <span class="menu-name" id="menu-name">Bram</span>
    </div>
    <div class="menubar-right">
      <a class="menu-icon" id="link-instagram" href="#" target="_blank" rel="noopener" title="Instagram" aria-label="Instagram">
        <svg viewBox="0 0 24 24" width="18" height="18"><rect x="2.5" y="2.5" width="19" height="19" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="17.4" cy="6.6" r="1.2" fill="currentColor"/></svg>
      </a>
      <a class="menu-icon" id="link-email" href="#" title="Email" aria-label="Email">
        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="2.5" y="5" width="19" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 6.5 12 13l8.5-6.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </a>
      <span class="menu-clock" id="clock">--:--:--</span>
    </div>
  </header>

  <!-- ===== Desktop ===== -->
  <main id="desktop" class="desktop" aria-label="Desktop">
    <div id="icons" class="icons"></div>
    <div id="windows" class="windows"></div>
  </main>

  <!-- ===== Hint (auto-hides) ===== -->
  <div id="hint" class="hint">double-click an icon — drag windows around</div>

  <script src="script.js?v=3"></script>

  <!-- Netlify Identity: enables the /admin login redirect after sign-in -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', function (user) {
        if (!user) {
          window.netlifyIdentity.on('login', function () { document.location.href = '/admin/'; });
        }
      });
    }
  </script>
</body>
</html>
