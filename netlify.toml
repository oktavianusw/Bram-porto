# Static site + a build step that compiles the CMS source files
# (content/site.json + content/projects/*.json) into content.json.
[build]
  publish = "."
  command = "node build.js"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Don't let the CDN cache the content/layout files — the site fetches them at runtime,
# so edits from the CMS / Layout Editor should show up immediately.
[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/layout.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Uploaded images/videos (wallpaper, project backgrounds, photos, profile pic):
# revalidate every load so re-uploaded files show up on a normal refresh —
# no hard-refresh needed, even for whoever is editing.
[[headers]]
  for = "/assets/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
