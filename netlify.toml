# Static site (no build) + serverless OAuth functions for the CMS.
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Don't let the CDN cache the content/layout files — the site fetches them at runtime,
# so edits from the CMS / Layout Editor should show up immediately.
[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/layout.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
