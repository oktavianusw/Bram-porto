# ============================================================
#  Decap CMS config — defines the editing UI at /admin
#  Webflow-like setup: "Projects" is a collection of items (folder
#  collection), "Site & profile" is a single settings page.
#  A build step (build.js) compiles these into content.json.
# ============================================================

backend:
  name: github
  repo: oktavianusw/Bram-porto
  branch: main
  base_url: https://bam-porto.netlify.app
  auth_endpoint: .netlify/functions/auth

local_backend: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: https://bam-porto.netlify.app
display_url: https://bam-porto.netlify.app

collections:
  # ============================================================
  #  PROJECTS — a collection of items (like Webflow "Video works")
  # ============================================================
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    description: "Each project is a folder on the desktop. Click a project to edit it, or “New Project” to add one."
    folder: "content/projects"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "label"
    slug: "{{fields.label}}"
    summary: "{{fields.label}}"
    sortable_fields: ["order", "label"]
    editor:
      preview: true            # live preview pane on the right
    fields:
      - { label: "Order", name: "order", widget: "number", default: 100, value_type: "int", hint: "Lower number shows first on the desktop." }
      - { label: "Folder name", name: "label", widget: "string", hint: "Label under the folder icon, e.g. “Across the Waters”." }
      - { label: "Big title", name: "title", widget: "string", hint: "Large heading when the folder opens." }
      - { label: "Subtitle", name: "titleAlt", widget: "string", required: false, hint: "Second line by the title — another language or a tagline." }
      - { label: "Info line", name: "meta", widget: "string", required: false, hint: "e.g. 2024 · Web App · Lead Developer" }
      - { label: "Description", name: "synopsis", widget: "text", required: false }
      - { label: "Background image", name: "bg", widget: "image", required: false, hint: "Behind the text, and the video’s first frame. Empty = colored placeholder." }
      - { label: "Background video", name: "bgVideo", widget: "file", required: false, hint: "Optional .mp4, plays muted on loop. Keep it small." }
      - { label: "Tint color", name: "overlay", widget: "color", enableAlpha: true, required: false, default: "rgba(40,40,55,0.5)", hint: "See-through color over the background so text stays readable." }
      - label: "Detail blocks"
        name: "blocks"
        widget: "list"
        required: false
        collapsed: true
        label_singular: "Block"
        summary: "{{fields.title}}"
        fields:
          - { label: "Block title", name: "title", widget: "string" }
          - { label: "Lines", name: "text", widget: "text", hint: "One item per line." }
      - label: "Buttons / links"
        name: "links"
        widget: "list"
        required: false
        collapsed: true
        label_singular: "Link"
        summary: "{{fields.label}}"
        fields:
          - { label: "Button text", name: "label", widget: "string" }
          - { label: "Web address", name: "url", widget: "string" }

  # ============================================================
  #  SITE & PROFILE — single settings page
  # ============================================================
  - name: "settings"
    label: "Site & profile"
    description: "Your profile, the Read Me note, the photo collage, and the CV."
    delete: false
    editor:
      preview: false
    files:
      - name: "site"
        label: "Site & profile"
        file: "content/site.json"
        fields:
          - label: "👤  Profile & contact"
            name: "profile"
            widget: "object"
            fields:
              - { label: "Your name", name: "name", widget: "string", hint: "Shown top-left of the menu bar." }
              - { label: "Profile picture", name: "profilePic", widget: "image", required: false }
              - { label: "Instagram link", name: "instagram", widget: "string", required: false, hint: "https://instagram.com/yourname" }
              - { label: "Email", name: "email", widget: "string", required: false, pattern: ['^$|^[^@\s]+@[^@\s]+\.[^@\s]+$', "Enter a valid email"] }

          - label: "📝  Read Me (the note)"
            name: "readme"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Window title", name: "title", widget: "string", default: "Read Me" }
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                label_singular: "Paragraph"
                summary: "{{fields.text}}"
                fields:
                  - { label: "Text", name: "text", widget: "text" }
                  - label: "Style"
                    name: "style"
                    widget: "select"
                    default: "normal"
                    options:
                      - { label: "Normal", value: "normal" }
                      - { label: "Big (intro line)", value: "lead" }
                      - { label: "Small (list line)", value: "small" }

          - label: "🖼️  Photos (collage)"
            name: "photos"
            widget: "list"
            label_singular: "Photo"
            summary: "Photo"
            collapsed: true
            hint: "Upload images — they’re scattered into a pile automatically."
            fields:
              - { label: "Image", name: "image", widget: "image", required: false }

          - label: "📄  CV"
            name: "cv"
            widget: "object"
            collapsed: true
            fields:
              - { label: "File name (no .pdf)", name: "fileLabel", widget: "string", default: "CV_2026" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role / tagline", name: "role", widget: "string", required: false }
              - label: "Sections"
                name: "sections"
                widget: "list"
                label_singular: "Section"
                summary: "{{fields.title}}"
                collapsed: true
                fields:
                  - { label: "Section title", name: "title", widget: "string", hint: "e.g. Work, Education, Skills" }
                  - label: "Entries (jobs / studies)"
                    name: "rows"
                    widget: "list"
                    required: false
                    collapsed: true
                    label_singular: "Entry"
                    summary: "{{fields.what}}"
                    fields:
                      - { label: "When", name: "when", widget: "string", required: false }
                      - { label: "Title", name: "what", widget: "string" }
                      - { label: "Detail", name: "sub", widget: "string", required: false }
                  - label: "Tags / skills"
                    name: "tags"
                    widget: "list"
                    required: false
                    hint: "Use instead of Entries for a skills section."
